  curie:
  - apiVersion: v2
    appVersion: 0.8.5
    created: "2026-09-03T13:08:26.795270056Z"
    description: 'Curie (Relay) umbrella chart. Installs the whole self-hosted stack
      on a single node: Langfuse v3 (web + worker) plus its ClickHouse, Valkey, Postgres,
      and RustFS backing stores, and the OTel Collector that adapts app traces into
      Langfuse. Every backing store is condition-gated with a bring-your-own block.
      A CPU-AVX / ClickHouse-pin check runs as a blocking pre-install, pre-upgrade
      hook; a NetworkPolicy-enforcement probe ships as a helm test that must be run
      explicitly.'
    digest: 43a8f23fdfa2eb2c7b989cc8b273913b133a3e2c764fb177d73964e0b9ac7a73
    home: https://github.com/curie-eng/curie
