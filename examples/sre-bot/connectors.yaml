# What this bot needs running. Curie derives the Deployment, Service, container
# hardening, host allowlist, sandbox-to-connector NetworkPolicy, secret wiring,
# and the URL the agent dials (ADR-0086).
#
# This replaces roughly 180 lines of hand-written Kubernetes per connector. None
# of it was this bot's business, and every copy of it was independently right or
# wrong.
#
# ---------------------------------------------------------------------------
# WHAT SHIPS ON, AND WHAT SHIPS OFF
# ---------------------------------------------------------------------------
#
#   kubernetes    ON.       Read-only cluster access. The only connector you
#                           need to make this bot useful, and the only one with
#                           no external dependency beyond the cluster itself.
#   k8s-write     DECLARED. One gated write verb. Its source build and exact
#                           approval gate ship together, but its separate
#                           K8S_WRITE_KUBECONFIG does not. Without that secret,
#                           bring-up refuses cleanly before any connector starts,
#                           so read-only operation remains the default. See
#                           README.md, "Level up: the gated write path".
#   k8s-scale     DECLARED. One gated, reversible scale verb, on its own
#                           subresource-scoped identity. Same shape as
#                           k8s-write: no K8S_SCALE_KUBECONFIG, no scale path.
#   self-upgrade  DECLARED. One gated verb that starts this bot's own upgrade,
#                           so it happens when asked rather than on a schedule,
#                           plus an ungated read saying which version is
#                           available to upgrade to.
#                           Needs SELF_UPGRADE_KUBECONFIG and the CronJob it
#                           starts. Read manifests/upgrade-role.yaml first: its
#                           grant is the widest in this bundle.
#   grafana       ON.       Logs, metrics, alerts and profiles from the bundled
#                           observability stack.
#   tempo         ON.       Distributed traces from the bundled stack.
#
# Removing a declared connector removes its tools. Remove any matching approval
# gate in the same change so the bundle remains valid.
connectors:
  # Read-only Kubernetes: the questions metrics cannot answer. What the
  # scheduler actually said, what a crashed container logged, what a manifest
  # currently declares.
  #
  # Tool surface verified against this image with these exact flags: 13 tools,
  # and `tools/list` reports readOnlyHint=true on every one. It was 14 until
  # `--toolsets core` dropped `configuration_view`; see below. `--read-only`
  # FILTERS the surface rather than merely advising, and `--disable-destructive`
  # sits under it.
  #
  #   events_list      the scheduler's reason string -- FailedScheduling,
  #                    FailedMount, BackOff, Evicted. A metric says a pod is
  #                    Pending; only this says why.
  #   pods_log         container logs for ANY namespace, including the platform
  #                    namespaces a log shipper is often not configured to
  #                    collect. Takes `previous`, so a crashed container's last
  #                    output is reachable.
  #   resources_get    describe-equivalent: the live manifest of any kind.
  #   nodes_log        kubelet logs, for when the node is the problem.
  #   *_top            live usage, no scrape delay.
  #
  # RETENTION IS THE LIMIT AND THIS DOES NOT CHANGE IT. Events expire from etcd
  # after about an hour and a pod's logs die with the pod, so this is live
  # introspection, not history. "Why was that pod Pending at 03:00?" asked at
  # 09:00 is still unanswerable, and SKILL.md tells the agent to say so rather
  # than report the silence as calm. Closing that gap means shipping Events into
  # a log store, which lives in your monitoring stack, not in this bundle.
  kubernetes:
    # PINNED, never `latest`. `latest` drifted between the flag check and the
    # cluster's pull: the tag that had `--bind-address` when the args below were
    # written no longer did by deploy time, so the container printed its usage
    # and exited into CrashLoopBackOff. A mutable tag turns "verified the flags"
    # into a statement about a moment rather than about the image.
    #
    # v0.0.66 verified directly: carries --port/--bind-address/--read-only/
    # --disable-destructive/--disable-multi-cluster/--stateless/--kubeconfig,
    # and publishes both amd64 and arm64.
    image: ghcr.io/containers/kubernetes-mcp-server@sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423
    args:
      - --port
      - "8000"
      - --bind-address
      - 0.0.0.0
      # Load-bearing. The RBAC on the mounted kubeconfig is the real boundary --
      # a write is refused server-side -- but the agent is prompt-injectable and
      # cannot be talked into calling a tool it cannot see. Tool filtering is
      # defense in depth, not the fence.
      - --read-only
      # `--read-only` is NOT sufficient on its own, and the reason is worth
      # keeping: `configuration_view` returns the kubeconfig as YAML --
      # including the bearer token in cleartext -- and it is annotated
      # readOnlyHint=true, because reading a credential IS a read. So the
      # read-only filter keeps it, and "all 14 tools are readOnlyHint" was
      # verified and still missed it.
      #
      # That tool alone defeats the property this whole shape exists for: the
      # sandbox is supposed to learn a URL and never hold a credential, so that
      # a successful prompt injection can only call read tools the connector
      # already allows -- not walk away with the token and post it into Slack.
      #
      # Default toolsets are `core,config`; `configuration_view` is the config
      # toolset's entire contribution here. Dropping to `core` removes exactly
      # that one tool, 14 -> 13, and keeps every tool SKILL.md uses:
      # events_list, pods_log, pods_get, pods_list, pods_list_in_namespace,
      # resources_get, resources_list, nodes_log, pods_top, nodes_top,
      # nodes_stats_summary, namespaces_list, projects_list.
      # Verified by diffing tools/list with and without the flag.
      - --toolsets
      - core
      - --disable-destructive
      # One cluster, one context -- otherwise the multi-cluster tools appear and
      # invite reasoning about clusters this bot has no business in.
      - --disable-multi-cluster
      - --stateless
      - --kubeconfig
      - /secrets/kubeconfig
    # Where to reach this on a tier that cannot host it (#1160). The `skill`
    # tier hosts nothing and `local` does not host connectors yet (#1159), so a
    # laptop run supplies its own copy's URL with `--secret K8S_MCP_URL`.
    #
    # On the cluster this is ignored -- the URL is derived from the Service
    # Curie creates, so a laptop's copy can never displace the real one.
    unhosted_url: ${K8S_MCP_URL}
    # A FILE, not an env var. This server authenticates only from a kubeconfig
    # on disk, which `connectors.yaml` could not express until #1403 -- the
    # first attempt at this connector declared `secrets:` and sat in
    # CreateContainerConfigError, because a secretKeyRef cannot become a file.
    #
    # A STATIC kubeconfig holding a ServiceAccount token, not a cloud-provider
    # `get-token` exec credential: an exec credential mints short-lived tokens
    # and would need cloud credentials sitting next to the connector purely to
    # refresh them. A ServiceAccount token keeps the whole blast radius inside
    # Kubernetes RBAC, where manifests/read-access.yaml bounds it -- verified it
    # cannot read Secrets or delete anything.
    secret_files:
      K8S_READONLY_KUBECONFIG: /secrets/kubeconfig

# ---------------------------------------------------------------------------
# THE GATED WRITE CONNECTOR -- DECLARED, WITH ITS CREDENTIAL ABSENT BY DEFAULT.
#
# What it is: a purpose-built server exposing exactly ONE tool,
# `restart_deployment`, behind a Curie approval gate. Calling it pauses the
# turn, posts an approval card, and a human decides. The agent never does.
#
# PURPOSE-BUILT, not kubernetes-mcp-server without `--read-only`. Dropping that
# flag would expose create/update/delete across every kind, so the bot would
# hold general write gated only by what `approvalPolicy` remembers to name --
# and a tool nobody thought to gate has nothing in front of it. This server
# exposes one tool, so there is no second thing for a gate to miss. Source and
# full reasoning: connectors/k8s-write/server.py.
#
# The connector declaration and its gate in `.claude-plugin/plugin.json` ship
# together. That closes the unsafe intermediate state where the tool exists but
# its gate does not. It does NOT grant a write path by itself. Before bring-up:
#
#   1. Apply `manifests/write-role.yaml` (after editing its namespace and
#      `resourceNames`) and store the resulting kubeconfig as
#      K8S_WRITE_KUBECONFIG.
#   2. Replace the K8S_WRITE_ALLOWLIST placeholder below with the one
#      `namespace/deployment` this bot may roll.
#   3. Build and deploy the declared source:
#
#          curie build --plugin-dir examples/sre-bot --registry <your-registry>
#
#      That builds every connector with a `build:` declaration for every named
#      platform and records the resolved digests in `connectors.lock.yaml`.
#      There is no `image:` line to edit: the digest lives in the lock.
#
# The missing separate kubeconfig is load-bearing -- but only once a lock file
# exists. On a genuinely untouched bring-up, the unbuilt connectors.lock.yaml
# refuses deploy before the secret check is ever reached; once built, the
# still-missing kubeconfig refuses just as cleanly before either connector
# starts, instead of silently running a writer with the read credential or an
# unreviewed target.
#
# Full walkthrough: README.md, "Level up: the gated write path".
#
# THE TOOL NAME BELOW IS NOT WHAT CURIE'S ERROR MESSAGE TELLS YOU. Tools here
# are `mcp__k8s-write__<tool>`, NOT `mcp__plugin_sre-bot_k8s-write__<tool>`.
# Curie connectors are platform-supplied servers on
# ClaudeAgentOptions.mcp_servers, so they are named like
# `mcp__curie__request_approval`, with no plugin infix. The deploy error advises
# the prefixed form; following it yields a gate that validates, deploys, and
# never fires.
#
  k8s-write:
    # Where the image comes FROM, instead of what it is. `curie build` builds
    # this context and records the digest it resolved in
    # `connectors.lock.yaml`; the deploy renders that digest and nothing else,
    # so the pinning note on `kubernetes` above, which is not theoretical, is
    # satisfied by construction here rather than by remembering to type an
    # immutable tag.
    #
    # `platforms` is required rather than defaulted, because a silently
    # single-arch image builds clean, passes CI, and then fails to pull on a
    # node of the other architecture as "no matching manifest".
    build:
      context: connectors/k8s-write
      platforms: [linux/amd64, linux/arm64]
    # Deliberately no `unhosted_url`: skill and local runs host this connector,
    # so they exercise the separate secret requirement instead of silently
    # dialing an operator-supplied copy. Re-run `curie build --plugin-dir`
    # after source or declaration changes so the lock matches what is hosted.
    env:
      # Defence in depth alongside the Role's `resourceNames`. A ceiling
      # stated in one place only is a ceiling that moves when someone edits
      # the other place. Format is `namespace/deployment`, comma-separated.
      # EMPTY MEANS THE CONNECTOR REFUSES TO START, not that everything is
      # permitted -- a missing config fails closed.
      K8S_WRITE_ALLOWLIST: <namespace>/<deployment>
    # A SEPARATE kubeconfig from the read-only one, bound to the
    # ServiceAccount in manifests/write-role.yaml: one namespace, get+patch on
    # exactly the named Deployments. Never the read-only connector's
    # credential -- that one is deliberately unable to write, and reusing it
    # here would mean widening it.
    secret_files:
      K8S_WRITE_KUBECONFIG: /secrets/kubeconfig

# ---------------------------------------------------------------------------
# THE GATED SCALE CONNECTOR -- DECLARED, CREDENTIAL ABSENT BY DEFAULT, AND
# REVERSIBLE.
#
# A second one-tool server rather than a second tool on `k8s-write`, for the
# reason that file's own docstring gives: it exposes ONE tool and takes no
# parameter through which a caller could reach a replica count. Adding one there
# would put caller input into a process whose whole argument is that no caller
# input reaches the patch body.
#
# It is also the NARROWER grant, and that is the interesting part. A rollout
# restart is a PATCH of the pod template, so RBAC cannot separate it from `set
# image`; scaling has `deployments/scale` as its own subresource, so
# `manifests/scale-role.yaml` grants a ceiling Kubernetes itself enforces.
#
# REVERSIBLE, which is why it exists at all (ADR-0117). It reads the replica
# count immediately before it patches and returns it, so the platform records
# what to restore without asking a model what happened -- and REFUSES TO WRITE if
# it cannot read one, because an action that happened without a recorded prior
# state leaves the platform holding a record it cannot act on. A restart cannot
# do this and says so in prose, which is how a receipt ends up honestly saying
# "restarting pods cannot be undone" next to "scaled 3 to 10, undo".
#
# Before bring-up: apply `manifests/scale-role.yaml`, store the resulting
# kubeconfig as K8S_SCALE_KUBECONFIG, and replace the allowlist placeholder.
  k8s-scale:
    build:
      context: connectors/k8s-scale
      platforms: [linux/amd64, linux/arm64]
    env:
      # Same ceiling discipline as the write connector, stated in two places on
      # purpose. EMPTY MEANS EVERY CALL IS REFUSED.
      K8S_SCALE_ALLOWLIST: <namespace>/<deployment>
      # A scale is reversible; an outage caused by a typo'd zero is still an
      # outage. This bounds the upper end; the allowlist bounds the target.
      K8S_SCALE_MAX_REPLICAS: "50"
    # A THIRD kubeconfig, bound to the ServiceAccount in
    # manifests/scale-role.yaml. Never the write connector's -- that one holds
    # `patch` on `deployments`, and reusing it here would throw away the
    # subresource ceiling that is this connector's whole security argument.
    secret_files:
      K8S_SCALE_KUBECONFIG: /secrets/kubeconfig

# ---------------------------------------------------------------------------
# THE GATED SELF-UPGRADE CONNECTOR -- SO THE UPGRADE IS ASKED FOR, NOT SCHEDULED.
#
# `self-upgrade/cronjob.yaml` already knows how to redeploy this bot from its
# repository. What it could not do is happen because someone asked: it ran on a
# schedule, so the answer to "upgrade yourself" was "wait until :17".
#
# This connector is the button. One tool, `upgrade_self`, taking NO ARGUMENTS at
# all -- the repository, branch, image and command all come from the CronJob's
# own template, read from the cluster at call time. It starts that Job and
# returns its name; the bot then watches it with the read-only Kubernetes tools
# and reports what happened.
#
# WHY THE BOT DOES NOT JUST DO THE UPGRADE. Creating an agent version needs the
# platform API key, and every `/agents/**` route requires it. The sandbox holds a
# per-turn `state`-scoped token and nothing else, deliberately: that is what
# makes a successful prompt injection unable to walk away with a credential.
# Handing the sandbox the platform key to make this work would trade that
# property for a convenience. So the key stays in the Job, and the bot only ever
# presses the button.
#
# THE GRANT IS THE WIDEST IN THIS BUNDLE and manifests/upgrade-role.yaml says so
# plainly: `create` on `jobs` cannot be narrowed with `resourceNames`, because a
# create has no name to match. Read that file before installing this.
#
# Before bring-up: apply `manifests/upgrade-role.yaml`, store the resulting
# kubeconfig as SELF_UPGRADE_KUBECONFIG, and install the CronJob (suspended --
# see self-upgrade/cronjob.yaml) that this starts. Without the credential,
# bring-up refuses cleanly, exactly like the other two write connectors.
  self-upgrade:
    build:
      context: connectors/self-upgrade
      platforms: [linux/amd64, linux/arm64]
    env:
      # Which upgrade this starts. Must agree with the `resourceNames` in
      # manifests/upgrade-role.yaml. EMPTY MEANS EVERY CALL IS REFUSED.
      SELF_UPGRADE_CRONJOB: sre-bot-self-upgrade
      # The namespace the Curie release runs in. Left unset, the connector reads
      # its own ServiceAccount namespace, which is the same place -- stated here
      # so a cross-namespace install does not silently look in the wrong one.
      SELF_UPGRADE_NAMESPACE: ""
      # Which project's published releases answer "what version is available".
      # A public, read-only lookup with NO credential -- the connector holds none
      # for it on purpose. Empty disables that tool's answer rather than guessing.
      #
      # This is what closes the question the sandbox cannot answer for itself:
      # the runner has no general internet egress (deliberately -- it is
      # prompt-injectable), so a direct fetch of a releases page is refused at
      # the network. Connector pods do have egress, so the read happens here and
      # the sandbox still learns only a URL.
      SELF_UPGRADE_RELEASE_REPO: curie-eng/curie
    # A FOURTH kubeconfig, bound to the ServiceAccount in
    # manifests/upgrade-role.yaml. Never one of the other three: those are
    # scoped to the workloads this bot may touch, and this one is scoped to the
    # platform's own namespace. Reusing either direction would widen both.
    secret_files:
      SELF_UPGRADE_KUBECONFIG: /secrets/kubeconfig
# ---------------------------------------------------------------------------

  # Both grafana and tempo below read GRAFANA_SERVICE_ACCOUNT_TOKEN from the
  # curie-grafana-connector Secret. Nothing in this bundle creates that
  # Secret -- `curie example sre-bot install --observability` provisions the
  # observability stack (see examples/sre-bot/observability/curie-values.yaml)
  # and the chart mints it from there. A manual `cluster deploy` against a
  # cluster that never ran that install leaves both connectors in
  # CreateContainerConfigError with no matching Secret to mount -- and the
  # deploy still exits 0, so "applied N object(s)" reads as success while
  # these two are broken.
  grafana:
    image: docker.io/grafana/mcp-grafana@sha256:5efeafd01cd7e1aea9c4b0f03305951f2944db8f43e5ae290cce9578c977f241
    args:
      - -t
      - streamable-http
      - -address
      - 0.0.0.0:8000
      - -allowed-hosts
      - ${CURIE_ALLOWED_HOSTS}
      - -enabled-tools
      - search,datasource,incident,prometheus,loki,alerting,dashboard,folder,oncall,asserts,sift,pyroscope,navigation,proxied,annotations,rendering,snapshot,plugin,api,config,provisioning,cloudwatch,runpanelquery,examples
      - -disable-write
      - -disable-api
      - -disable-plugin
      - -disable-provisioning
      - -disable-snapshot
      - -disable-admin
      - -disable-incident
      - -disable-proxied
      - -disable-rendering
    unhosted_url: ${GRAFANA_MCP_URL}
    env:
      GRAFANA_URL: http://grafana.observability.svc.cluster.local
    secrets:
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        from_secret: curie-grafana-connector
        key: GRAFANA_SERVICE_ACCOUNT_TOKEN
  tempo:
    build:
      context: connectors/tempo
      platforms: [linux/amd64, linux/arm64]
    unhosted_url: ${TEMPO_MCP_URL}
    env:
      GRAFANA_URL: http://grafana.observability.svc.cluster.local
    secrets:
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
        from_secret: curie-grafana-connector
        key: GRAFANA_SERVICE_ACCOUNT_TOKEN
