# The write identity for the gated write connector.
#
#     kubectl apply -f examples/sre-bot/manifests/write-role.yaml
#
# ONLY NEEDED FOR THE WRITE PATH. The shipped bundle declares the gated
# `k8s-write` connector, but without `K8S_WRITE_KUBECONFIG` bring-up refuses
# before any connector starts. Apply this as step 2 of README.md's
# "Level up: the gated write path".
#
# EDIT TWO THINGS BEFORE APPLYING: the namespace (five occurrences -- one of
# them is the RoleBinding's `subjects[0].namespace`, indented under `subjects:`
# rather than sitting at `metadata.namespace`, so it's easy to miss) and the
# `resourceNames` list. Re-applying is safe and idempotent; changing what it
# grants is not, so read the two sections below first.
#
# Missing the `subjects[0].namespace` occurrence does NOT fail `kubectl apply`
# -- every object still reports `created`. It fails silently instead: the
# RoleBinding points at a ServiceAccount in the wrong namespace, so the
# identity grants nothing. The tell is the first `can-i` ceiling proof below
# printing `no` where it should print `yes` -- don't mistake it for one of the
# reassuring `no`s the next two lines want.
#
# ---------------------------------------------------------------------------
# The thing to understand before widening anything here
# ---------------------------------------------------------------------------
#
# `kubectl rollout restart` is not a distinct permission. It is implemented as a
# PATCH to the Deployment's pod template, setting the
# `kubectl.kubernetes.io/restartedAt` annotation. Kubernetes RBAC grants verbs
# on resources; it cannot say "patch only this one field".
#
# So `patch` on `deployments` is EXACTLY the same grant as:
#
#     kubectl -n <ns> set image deploy/my-app app=totally-different-image
#     kubectl -n <ns> set env   deploy/my-app SOME_API_KEY=...
#     kubectl -n <ns> patch     deploy/my-app -p '{"spec":{"template":{"spec":
#                                 {"containers":[{"command":["/bin/sh","-c","..."]}]}}}}'
#
# A grant that permits a restart permits replacing what runs. There is no RBAC
# expression that separates them. Anyone reading this file and thinking "restart
# is harmless, let me add a few more namespaces" is widening arbitrary code
# execution across those namespaces.
#
# ---------------------------------------------------------------------------
# What actually constrains it, in order of strength
# ---------------------------------------------------------------------------
#
# 1. THE CONNECTOR. The strongest constraint is not here -- it is that the
#    connector process only ever emits the restart annotation patch. It exposes
#    no tool that takes an image, an env var, or a command. The agent is
#    prompt-injectable; the connector is not, the same argument that keeps every
#    other credential out of the sandbox. Any tool added there must be written
#    to construct its own patch body, NEVER to forward a caller-supplied one.
#
# 2. resourceNames. Narrows the blast radius to named workloads, so even a
#    compromised connector cannot touch anything not listed. This is the only
#    RBAC-level narrowing available, and it is why the list below is explicit
#    rather than a wildcard. `resourceNames` does NOT work for `list`/`watch`
#    (the API server cannot filter a collection request by name), which is fine:
#    reads come from the read-only connector, not this identity.
#
# 3. The approval gate. Stops a call before it executes, but lives in the
#    platform -- it is a control on the agent, not on the credential. If the
#    credential leaks, the gate is irrelevant. Order matters: assume the gate
#    is absent when deciding what this Role may do.
#
# Deliberately NOT granted, despite being the obvious next asks:
#   - `pods delete`       -- deleting a pod is a restart with worse failure modes
#                            (no surge, no rollback, no record on the Deployment).
#                            `rollout restart` covers the same intent safely.
#   - `deployments scale` -- a separate decision with a separate blast radius
#                            (scale to 0 is an outage). It now exists, and it is
#                            deliberately NOT here: see manifests/scale-role.yaml,
#                            which grants `deployments/scale` -- its own
#                            subresource -- to its own identity, with its own
#                            gate. That grant cannot reach the pod template at
#                            all, which is a ceiling this role cannot have.
#   - anything cluster-scoped, anything in a platform namespace, any
#     `create`/`delete`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-bot-writer
  # CHANGE ME: the namespace holding the one Deployment this bot may restart.
  # It does NOT have to be the namespace Curie runs in, and usually is not --
  # this identity belongs next to the workload, not next to the platform.
  namespace: curie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-bot-writer
  namespace: curie
rules:
  # `get` is needed to read the Deployment before patching it and to confirm the
  # patch was accepted afterwards. It is scoped to the same names as the patch,
  # so this identity cannot enumerate the namespace.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      # CHANGE ME: the one Deployment this bot may restart. One name, not a
      # list, unless someone has actually asked for the second one -- the
      # narrowest set that answers the real question is the right starting
      # point, and widening is an operator change with its own review.
      #
      # This must agree with the connector's `K8S_WRITE_ALLOWLIST` in
      # connectors.yaml, which states the same ceiling as
      # `<namespace>/<deployment>`. Two places on purpose: a ceiling stated once
      # is a ceiling that moves when someone edits the other place.
      - my-app
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-bot-writer
  namespace: curie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-bot-writer
subjects:
  - kind: ServiceAccount
    name: sre-bot-writer
    namespace: curie
---
# The non-expiring token, same reasoning as manifests/read-access.yaml: the
# connector authenticates from a static kubeconfig file and cannot refresh a
# projected token. Folded in here so one `kubectl apply` mints the identity AND
# the credential you are about to assemble a kubeconfig from.
apiVersion: v1
kind: Secret
metadata:
  name: sre-bot-writer-token
  namespace: curie
  annotations:
    kubernetes.io/service-account.name: sre-bot-writer
type: kubernetes.io/service-account-token
