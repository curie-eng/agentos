# The scale identity for the gated scale connector.
#
#     kubectl apply -f examples/sre-bot/manifests/scale-role.yaml
#
# SEPARATE FROM write-role.yaml ON PURPOSE, and the separation is enforced by
# Kubernetes rather than by this bundle.
#
# ---------------------------------------------------------------------------
# Why this identity is narrower than the restart one
# ---------------------------------------------------------------------------
#
# `write-role.yaml` explains at length that `patch` on `deployments` cannot be
# narrowed to "only the restart annotation": it is the same grant as `set image`,
# `set env`, and replacing the container command. That role's only real ceiling
# is `resourceNames`, plus a connector written never to forward a caller's patch.
#
# Scaling does not have that problem. Kubernetes exposes `scale` as its own
# SUBRESOURCE, so `patch` on `deployments/scale` grants exactly one thing: the
# replica count. It cannot change an image, a command, or an env var, and that is
# the API server refusing rather than a Python file declining. This is the one
# case in this bundle where the RBAC boundary is the strong constraint and the
# connector is defense in depth, instead of the other way round.
#
# So do NOT merge this into write-role.yaml. Granting `patch` on `deployments`
# to this identity in the name of tidiness would trade an enforced ceiling for an
# advisory one.
#
# ---------------------------------------------------------------------------
# What scaling can still do, which is not nothing
# ---------------------------------------------------------------------------
#
# `--replicas=0` is an outage, and this grant permits it. The ceilings that
# answer that are the connector's `K8S_SCALE_ALLOWLIST` and its
# `K8S_SCALE_MAX_REPLICAS`, plus the approval gate in `.claude-plugin/plugin.json`
# -- which is why the gate ships in the same change as the connector.
#
# `get` is needed for a reason worth stating: the connector reads the replica
# count immediately before it patches, and REFUSES TO WRITE if it cannot read
# one. That read is what makes the action reversible (ADR-0117), and an action
# that happened without a recorded prior state is worse than one that did not
# happen -- it leaves the platform holding a record it cannot act on.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-bot-scaler
  # CHANGE ME: the namespace holding the Deployment this bot may scale.
  namespace: curie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-bot-scaler
  namespace: curie
rules:
  # The SUBRESOURCE, not the Deployment. `deployments/scale` is what makes this
  # grant unable to reach the pod template at all.
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames:
      # CHANGE ME: the Deployment this bot may scale. Must agree with the
      # connector's K8S_SCALE_ALLOWLIST in connectors.yaml -- two places on
      # purpose, so a ceiling stated once cannot move when someone edits the
      # other place.
      - my-app
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-bot-scaler
  namespace: curie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-bot-scaler
subjects:
  - kind: ServiceAccount
    name: sre-bot-scaler
    # Easy to miss: this is indented under `subjects`, not `metadata.namespace`.
    # Getting it wrong does not fail `kubectl apply` -- every object still
    # reports `created` and the identity simply grants nothing.
    namespace: curie
---
# The non-expiring token, same reasoning as the other two manifests: the
# connector authenticates from a static kubeconfig file and cannot refresh a
# projected token.
apiVersion: v1
kind: Secret
metadata:
  name: sre-bot-scaler-token
  namespace: curie
  annotations:
    kubernetes.io/service-account.name: sre-bot-scaler
type: kubernetes.io/service-account-token
