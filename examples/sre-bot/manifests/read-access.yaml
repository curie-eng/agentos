# The read-only identity the `kubernetes` connector authenticates as.
#
#     kubectl apply -f examples/sre-bot/manifests/read-access.yaml
#
# Re-applying is safe and idempotent. Widening what it grants is not, so read
# the three sections below before editing.
#
# ---------------------------------------------------------------------------
# Why not just bind the built-in `view` ClusterRole
# ---------------------------------------------------------------------------
#
# `view` is the obvious answer and it is half right. It deliberately excludes
# Secrets while still including `pods/log`, which is exactly the shape wanted --
# but it covers NAMESPACED reads only, so nodes, namespaces and
# persistentvolumes (all cluster-scoped) fall outside it, and those are the
# first things anyone asks this bot about.
#
# So this file enumerates instead: add back exactly what the bot needs, and
# nothing that carries a credential.
#
# What you must NOT do, and the reason it is tempting: `resources: ["*"]` with
# `get,list,watch` reads as "just make it read-only". It includes SECRETS. This
# agent is prompt-injectable AND posts what it finds into a chat channel, so
# that one line turns it into a credential exfiltration path with a friendly
# interface. **`configmaps` is in the list below and `secrets` is not.** That is
# the line. Never widen it to a wildcard.
#
# ---------------------------------------------------------------------------
# Why a token Secret, and why it must not expire
# ---------------------------------------------------------------------------
#
# Since Kubernetes 1.24 a ServiceAccount does not get a token Secret
# automatically -- the modern path is a short-lived projected token, which a
# workload refreshes from its own in-cluster identity. The connector cannot do
# that: it authenticates from a STATIC kubeconfig file mounted at
# `/secrets/kubeconfig`, and it has no way to refresh a token. So the token must
# not expire, which means asking for one explicitly with the
# `kubernetes.io/service-account-token` Secret type below.
#
# The alternative -- a cloud provider's `get-token` exec credential -- was
# rejected: it mints 15-minute credentials and would need cloud API keys sitting
# next to the connector purely to refresh them, moving the blast radius out of
# Kubernetes RBAC where this file can bound it.
#
# ---------------------------------------------------------------------------
# Verify it before trusting it
# ---------------------------------------------------------------------------
#
#     kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-reader \
#       list pods --all-namespaces          # yes
#     kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-reader \
#       get secrets --all-namespaces        # NO   <-- if this says yes, stop
#     kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-reader \
#       delete pods --all-namespaces        # NO
#     kubectl auth can-i --as=system:serviceaccount:curie:sre-bot-reader \
#       create pods/exec --all-namespaces   # NO
#
# **Three `no`s are the passing result.** A `yes` on secrets means the binding
# picked up something broader than this file -- fix the role, not the connector
# flags.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-bot-reader
  # Every namespaced object here lives in `curie`, the default release
  # namespace. Change all four if you install the release somewhere else --
  # they must agree, and the `kubectl auth can-i --as=` strings above name it
  # too.
  namespace: curie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-bot-reader
rules:
  # Deliberately enumerated. See the header: a wildcard here includes Secrets.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - namespaces
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Events live in two API groups and a cluster serves whichever its components
  # write to. Granting only the core group is how `events_list` comes back empty
  # on a modern cluster and reads as "nothing is wrong".
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  # Live CPU/memory, if metrics-server is installed. Without it `pods_top` and
  # `nodes_top` return an error rather than nothing, which the skill is told to
  # report as a capability gap rather than as a healthy cluster.
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # OPTIONAL, and only useful if you run Argo CD. Reading Application objects is
  # how "what deployed, and when" gets answered: sync status, the git revision
  # actually running, the deploy history with timestamps, and per-resource
  # OutOfSync state all live on the CR. Granting it on a cluster with no Argo CD
  # is harmless -- the API group does not exist, so the rule grants nothing --
  # so it is left on rather than commented out.
  #
  # This deliberately replaces an Argo CD API token. Minting one needs a local
  # account in `argocd-cm`, and Argo CD typically syncs its own config from git,
  # so a hand-added account is drift that dies at the next sync. No token, no
  # drift, and the CR already carries everything the token would have bought.
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  # NOT GRANTED, deliberately: `nodes/proxy`, `nodes/log`, `nodes/stats`.
  #
  # The connector's `nodes_log` and `nodes_stats_summary` tools go through the
  # kubelet API, which needs one of those subresources. `nodes/proxy` in
  # particular is a general proxy to every kubelet in the cluster -- a much
  # larger grant than the two tools it buys, and one that reaches endpoints this
  # enumeration never reviewed. Those two tools therefore fail on this identity.
  #
  # That is the intended trade, and the failure is honest: the tool returns a
  # permission error the agent reports as a permission error. Add the
  # subresource only if you have a specific need, and grant `nodes/log` +
  # `nodes/stats` rather than the whole proxy.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-bot-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-bot-reader
subjects:
  - kind: ServiceAccount
    name: sre-bot-reader
    namespace: curie
---
# The non-expiring token. See the header for why this exists rather than a
# projected ServiceAccount token.
apiVersion: v1
kind: Secret
metadata:
  name: sre-bot-reader-token
  namespace: curie
  annotations:
    kubernetes.io/service-account.name: sre-bot-reader
type: kubernetes.io/service-account-token
