# Notice when a newer version of this bundle exists in the repository.
#
#   kubectl -n <curie-namespace> create configmap sre-bot-self-upgrade \
#     --from-file=redeploy.py=examples/sre-bot/self-upgrade/redeploy.py
#   kubectl -n <curie-namespace> apply -f examples/sre-bot/self-upgrade/cronjob.yaml
#
# EDIT BEFORE APPLYING: the namespace on both objects, and `CURIE_API_URL`'s
# service name if the release is not called `curie`.
#
# WHY A JOB AND NOT THE BOT. Creating an agent version needs the platform API
# key, and every `/agents/**` route requires it. The sandbox holds a per-turn
# `state`-scoped token and nothing else, deliberately. So the work sits outside
# the sandbox, and the bot's own authority is unchanged by this file.
#
# HOW IT DEPLOYS SAFELY. The bundle in the repository declares `build:` for its
# connectors, which records a LOCAL image id the cluster tier refuses, and it
# ships PLACEHOLDER allowlists. Deploying it verbatim would produce a bot whose
# connectors cannot start, or one that refuses every write and looks like it
# simply chose not to act. So the job pins each `build:` connector to the image
# `release.yaml` published for THIS commit (`sha-<commit>`, so the images can
# only ever be the ones built from the bundle being deployed), and carries the
# ceilings the install is actually running across from the rendered objects.
#
# THE TOKEN. Optional while the repository is public. On a private one
# `GITHUB_TOKEN` needs `contents: read` and nothing else; without it the job
# exits non-zero and says so, because a silent "nothing to do" is
# indistinguishable from "up to date" and can stay that way for months.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sre-bot-self-upgrade
  # CHANGE ME: the namespace the Curie release runs in.
  namespace: curie
spec:
  # Hourly. The thing being watched moves on human timescales, and the GitHub
  # API is rate limited per token, so a tighter schedule buys nothing.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: check
              # The platform's own API image, because the script needs a YAML
              # parser to rewrite the connector declaration and this image
              # already carries one. A bare `python:` image plus a pip install
              # would put a package download in the deploy path.
              # CHANGE ME to match the release's version.
              image: ghcr.io/curie-eng/curie-api:0.7.0
              command: ["python3", "/opt/self-upgrade/redeploy.py"]
              env:
                - name: CURIE_API_URL
                  # CHANGE ME with the release name if it is not `curie`.
                  value: http://curie-api:8000
                - name: CURIE_SELF_UPGRADE_REPO
                  value: curie-eng/curie
                - name: CURIE_SELF_UPGRADE_BRANCH
                  value: main
                - name: CURIE_SELF_UPGRADE_AGENT
                  value: sre-bot
                # The rendered connector objects are namespaced by the release
                # that owns them, so reading the running ceilings needs both.
                - name: CURIE_SELF_UPGRADE_RELEASE
                  value: curie
                - name: CURIE_SELF_UPGRADE_NAMESPACE
                  value: curie
                - name: CURIE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      # The release's own Secret. CHANGE ME with the release name.
                      name: curie-secrets
                      key: apiKey
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: curie-secrets
                      key: githubToken
                      # Optional so the job starts and reports the missing token
                      # itself, rather than sitting in CreateContainerConfigError
                      # where the cause is a pod event nobody is watching.
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 10m, memory: 64Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - name: script
                  mountPath: /opt/self-upgrade
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: sre-bot-self-upgrade
