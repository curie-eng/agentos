{{/*
Generated from the API schema window and Alembic graph (ADR-0142). Never make
this a values override: the target binary determines compatibility. The CLI
reads this template before mutation; the installed copy records provenance.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "curie.fullname" . }}-schema-compat
  labels:
    {{- include "curie.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-compat
data:
  application-version: {{ .Chart.AppVersion | quote }}
  compatibility.json: |
    {{- .Files.Get "files/schema-compat.json" | nindent 4 }}
