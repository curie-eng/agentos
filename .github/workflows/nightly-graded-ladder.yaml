name: Nightly graded parity ladder

# The graded sibling of ci.yaml's fake parity-ladder jobs (e2e-ladder,
# e2e-ladder-cluster). Those run on every PR against the sealed fake-model
# install, which ADR-0055 bounds to plumbing-only: a green there proves the
# wiring, never that a real model given the weather bundle actually answers.
# This workflow runs the SAME ladder mechanics LIVE against a real model over
# OpenRouter, so the graded promise is verified continuously rather than only
# by a manual source run before a release. See ADR-0081.
on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC, off-peak; cron is always UTC
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model route for the graded run"
        required: false
        default: "z-ai/glm-5.2"

# Supersede an in-flight run when the same ref is pushed again so scheduled and
# dispatch runs stop stacking.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (#632): the nightly reads the checkout and consumes a secret;
# it never writes back to the repo.
permissions:
  contents: read

jobs:
  # Mirror ci.yaml's rust-build: a standalone nightly has no upstream binary
  # producer, so it builds the release binary itself and both ladder jobs
  # download it as an artifact.
  build-cli:
    name: Build the curie release binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustc --version
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Release build
        run: cargo build --release --locked
      - name: Upload curie binary
        uses: actions/upload-artifact@v7
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release/curie
          if-no-files-found: error

  # Graded sibling of ci.yaml's e2e-ladder: same skill + local rung mechanics,
  # armed live against the real model instead of the fake fixture.
  ladder-skill-local:
    name: Graded parity ladder (skill + local, live model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the build-cli job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      # Image builds mirror e2e-ladder exactly: a named cache-only buildx
      # builder that is NOT made the default (`use: false`) so the
      # compose-triggered worker-local overlay build still resolves the
      # `:ci-local` FROM bases from the plain docker builder's daemon store
      # (#697/#791/#803). Same pinned actions and gha scopes as ci.yaml.
      - name: Set up a cache-only buildx builder (named, NOT the default -- preserves compose FROM, #803)
        id: laddercache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the runner image locally (gha layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: curie-runner
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      - name: Retag the runner image for the compose worker (CURIE_RUNNER_IMAGE, no registry auth)
        run: docker tag curie-runner ghcr.io/curie-eng/curie-runner:latest
      - name: Build the api image locally (satisfies curie-api + curie-migrate, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-api:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker base image locally (satisfies the worker-local overlay's FROM, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.laddercache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-worker:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      # Live grading: CURIE_E2E_LIVE drops the fake fixture and the ladder reads
      # the OpenRouter credential from CURIE_CREDENTIALS (the one env key the CLI
      # reads; an sk-or- key auto-selects OPENROUTER_BASE_URL). The secret
      # travels only as this env mapping, never on a run: or argv line.
      - name: Graded parity ladder (skill + local rungs, live model)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_BASE_TAG: ci-local
          CURIE_E2E_TIERS: skill,local
          CURIE_E2E_LIVE: "1"
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: bash cli/scripts/e2e-ladder.sh

  # Graded sibling of ci.yaml's e2e-ladder-release (#947): the same
  # generated-release-compose round trip, armed live. ci.yaml exercises this rung
  # against the FAKE model only, so the compose.release.yaml parity seam -- the
  # artifact a RELEASE binary's `curie local up` actually runs, derived from
  # compose.dev.yaml by compose/generate_release_compose.py -- was the one rung
  # never graded against a real model. `local-release` is deliberately NOT folded
  # into CURIE_E2E_TIERS=all because the rung preflights that the release-pinned
  # images already exist locally (a release binary has no checkout to build them
  # from), so this job builds them first and then names the rung explicitly.
  ladder-local-release:
    name: Graded parity ladder (local-release, live model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the build-cli job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      # Image builds mirror e2e-ladder-release exactly: a named cache-only buildx
      # builder that is NOT made the default (`use: false`) so the
      # compose-triggered worker-local overlay build below still resolves its
      # `:ci-local` FROM base from the plain docker builder's daemon store
      # (#697/#791/#803). Same pinned actions and gha cache scopes as ci.yaml.
      - name: Set up a cache-only buildx builder (named, NOT the default -- preserves compose FROM, #803)
        id: releasecache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the runner image locally (gha layer cache)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: curie-runner
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      - name: Retag the runner image for the compose worker (CURIE_RUNNER_IMAGE, no registry auth)
        run: docker tag curie-runner ghcr.io/curie-eng/curie-runner:latest
      - name: Build the api image locally (satisfies curie-api + curie-migrate, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-api:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker base image locally (satisfies the worker-local overlay's FROM, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-worker:ci-local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      # Mirrors ci.yaml's e2e-ladder-release step of the same name. The ladder
      # selects compose's `full` profile whenever the bundle carries
      # evals/trajectory.json, which the weather bundle this rung runs does, and
      # that profile pins the ui image too (#2005). The ui image is not a FROM
      # consumer, so it builds on the named cache-only builder like api/worker.
      - name: Build the ui image locally (satisfies the generated release compose, no registry auth)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/ui/Dockerfile
          builder: ${{ steps.releasecache.outputs.name }}
          tags: ghcr.io/curie-eng/curie-ui:latest
          push: false
          load: true
          cache-from: type=gha,scope=ladder-ui
          cache-to: type=gha,mode=max,scope=ladder-ui
      # The generated release compose pins `:latest` images and carries no build
      # directive, so satisfy those refs here: the ui build above, plus retag the
      # api build, and build the worker-local overlay with plain `docker build`
      # (it is the FROM consumer, so it must stay on the default plain-docker
      # builder, #803).
      - name: Tag the api image for the generated release compose (ghcr.io/curie-eng/curie-api:latest, no registry auth)
        run: docker tag ghcr.io/curie-eng/curie-api:ci-local ghcr.io/curie-eng/curie-api:latest
      - name: Build the worker-local overlay for the generated release compose (ghcr.io/curie-eng/curie-worker-local:latest, no registry auth)
        run: docker build --build-arg BASE_TAG=ci-local -t ghcr.io/curie-eng/curie-worker-local:latest -f compose/worker-local.Dockerfile compose
      # Live grading, same posture as the other rungs: CURIE_E2E_LIVE drops the
      # fake fixture and the ladder reads the OpenRouter credential from
      # CURIE_CREDENTIALS. The secret travels only as this env mapping, never on
      # a run: or argv line. No CURIE_BASE_TAG here (unlike the skill+local job):
      # this rung runs against the generated release compose, whose image refs are
      # the `:latest` tags built above, not a base-tag override.
      - name: Graded parity ladder (local-release rung against generated compose.release.yaml, live model)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_E2E_TIERS: local-release
          CURIE_E2E_LIVE: "1"
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: bash cli/scripts/e2e-ladder.sh

  # Graded sibling of ci.yaml's e2e-ladder-cluster: same kind substrate and
  # round-trip mechanics, but the install is graded (not sealed) and the run
  # step is armed live.
  ladder-cluster:
    name: Graded parity ladder (cluster rung on kind, live model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the curie binary built by the build-cli job
        uses: actions/download-artifact@v8
        with:
          name: curie-x86_64-linux-${{ github.sha }}
          path: cli/target/release
      - name: Make the binary executable
        run: chmod +x cli/target/release/curie
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      # GHA-layer-cached builds via a named buildx builder that is NOT made the
      # default (`use: false`), same mechanism e2e-ladder documents. `load:
      # true` exports each image into the local daemon store so `kind load`
      # picks it up with no registry round trip. Only the four images the
      # cluster round trip needs; the dispatcher is not deployed.
      - name: Set up a cache-only buildx builder (named, NOT the default)
        id: clustercache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          use: false
      - name: Build the api image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-api:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-api
          cache-to: type=gha,mode=max,scope=ladder-api
      - name: Build the worker image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-worker:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-worker
          cache-to: type=gha,mode=max,scope=ladder-worker
      - name: Build the ui image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/ui/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-ui:local
          push: false
          load: true
          cache-from: type=gha,scope=ladder-ui
          cache-to: type=gha,mode=max,scope=ladder-ui
      - name: Build the runner image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runner/Dockerfile
          builder: ${{ steps.clustercache.outputs.name }}
          tags: curie-runner:latest
          push: false
          load: true
          cache-from: type=gha,scope=ladder-runner
          cache-to: type=gha,mode=max,scope=ladder-runner
      # kind config: map the UI NodePort (chart default 30080) to the host so
      # `cluster deploy`'s UI `/api` NodePort discovery -- which resolves the
      # loopback kubeconfig host (127.0.0.1) -- reaches the in-cluster API.
      - name: Write the kind cluster config
        run: |
          cat > kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 30080
                  listenAddress: "127.0.0.1"
                  protocol: TCP
          EOF
      # Disposable kind cluster. Pins both the action and the kind/node-image
      # versions. The `kind` Docker network (created here) is the bridge every
      # node container sits on; its gateway is the host address the in-cluster
      # worker reaches the reply stub through, resolved below.
      - name: Create the kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: curie-e2e
          config: kind-config.yaml
      # Load the four locally-built images into the node store so the install's
      # pullPolicy Never overrides bind them with no registry pull.
      - name: Load images into the kind cluster
        run: |
          set -euo pipefail
          for img in curie-api:local curie-worker:local curie-ui:local curie-runner:latest; do
            kind load docker-image "$img" --name curie-e2e
          done
      # The pod-reachable host for the reply stub: the kind Docker network
      # gateway. Every node container sits on this bridge, so a pod egressing
      # through its node reaches the host here; the stub binds 0.0.0.0 and
      # answers on it. Auto-detection (loopback API server) cannot produce this
      # value on kind. Resolved before the install now that the install trusts
      # the stub origin, and it only needs the kind node container, which is
      # already running by here.
      - name: Resolve the pod-reachable host for the reply stub
        run: |
          set -euo pipefail
          # The kind bridge's IPv4 gateway is the host address every node -- and
          # every pod egressing through its node -- can reach; the stub binds
          # 0.0.0.0 and answers on it. The `kind` Docker network is frequently
          # dual-stack, so IPAM.Config carries both an IPv4 and an IPv6 entry in
          # an unspecified order (and an entry may omit Gateway) -- `index 0` is
          # not reliably the IPv4 one. Read the gateway the control-plane node
          # container actually got first, then fall back to ranging the
          # network's IPAM for a dotted-quad gateway.
          node="curie-e2e-control-plane"
          gw="$(docker inspect "$node" --format '{{ .NetworkSettings.Networks.kind.Gateway }}' 2>/dev/null || true)"
          if [[ ! "$gw" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            gw="$(docker network inspect kind \
                    --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' 2>/dev/null \
                  | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' | head -1 || true)"
          fi
          if [[ ! "$gw" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "could not resolve the kind network IPv4 gateway" >&2
            echo "--- docker network inspect kind ---" >&2
            docker network inspect kind >&2 || true
            echo "--- docker inspect $node (.NetworkSettings.Networks) ---" >&2
            docker inspect "$node" --format '{{json .NetworkSettings.Networks}}' >&2 || true
            exit 1
          fi
          echo "kind network gateway (worker->stub reply host): $gw"
          echo "CURIE_E2E_LISTEN_HOST=$gw" >> "$GITHUB_ENV"
      # The graded install. Unlike ci.yaml's cluster job (which seals the
      # install credential-free, the plumbing-only path ADR-0055 bounds), this
      # install is armed: no seal flag, the OpenRouter credential supplied via
      # CURIE_CREDENTIALS env (cluster up masks it and adds fakeModel=false
      # automatically), CURIE_MODEL env baked into the release as the runner's
      # model (cluster up reads it from env; it has no --model flag), and
      # --allow-egress-host openrouter (the provider KEYWORD, resolved to a /32
      # host route at install time) so the default-deny runner sandbox can
      # reach OpenRouter. The --set overrides repoint every first-party image at
      # the just-loaded local tags with pullPolicy Never, force gVisor off (no
      # runsc on kind nodes -- a real-model install fails closed without this),
      # and drop the dispatcher (no Slack; its presence would trip the
      # `cluster message` reply-hijack guard). The secret travels in env, never
      # on argv. worker.slackTrustedOrigins is a CI only widening that lets the
      # worker answer the host side reply stub on any kernel assigned port on
      # this host. The portless origin is intentional because `cluster message`
      # requests an ephemeral port; the chart default stays empty and fail closed.
      - name: Install the platform (curie cluster up, graded)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: |
          set -euo pipefail
          "$CURIE_BIN" cluster up \
            --chart charts/curie \
            --dev \
            --allow-egress-host openrouter \
            --set security.gvisor.mode=off \
            --set dispatcher.deploy=false \
            --set worker.slackTrustedOrigins="http://${CURIE_E2E_LISTEN_HOST}" \
            --set api.image.repository=curie-api --set api.image.tag=local --set api.image.pullPolicy=Never \
            --set worker.image.repository=curie-worker --set worker.image.tag=local --set worker.image.pullPolicy=Never \
            --set ui.image.repository=curie-ui --set ui.image.tag=local --set ui.image.pullPolicy=Never \
            --set agentSandbox.runner.image=curie-runner --set agentSandbox.runner.tag=latest --set agentSandbox.runner.imagePullPolicy=Never \
            --set agentSandbox.runner.prewarm.imagePullPolicy=Never
      # `cluster up` does not `helm --wait` (the argv stays a thin wrapper), so
      # wait for the rollouts the round trip depends on before driving it.
      # Langfuse and ClickHouse are intentionally NOT waited on -- a single
      # graded turn does not need traces flushed, and they are the slowest pods
      # to settle.
      - name: Wait for the platform to become ready
        run: |
          set -euo pipefail
          kubectl rollout status deploy/curie-api -n curie --timeout=300s
          kubectl rollout status deploy/curie-worker -n curie --timeout=300s
          kubectl rollout status deploy/curie-ui -n curie --timeout=300s
          kubectl rollout status daemonset/curie-runner-prewarm -n curie --timeout=300s
      # The cluster rung only, live: `cluster status` gate -> `cluster deploy`
      # -> `cluster message` (reply asserted). The model is baked at install
      # time, but apply_model_mode still hard-exits under CURIE_E2E_LIVE if no
      # credential is in env, so CURIE_CREDENTIALS is supplied here too.
      # CURIE_E2E_LISTEN_HOST was exported to the job env above.
      - name: Graded parity ladder (cluster rung, live model)
        env:
          CURIE_BIN: cli/target/release/curie
          CURIE_E2E_TIERS: cluster
          CURIE_E2E_LIVE: "1"
          CURIE_CREDENTIALS: ${{ secrets.OPENROUTER_API_KEY }}
          CURIE_MODEL: ${{ inputs.model || 'z-ai/glm-5.2' }}
        run: bash cli/scripts/e2e-ladder.sh
      # --- Soak rung (REPORT ONLY, #2056) -----------------------------------
      #
      # `tests/soak/` had never run in any automated path: it needs a STANDING
      # cluster with a claimable warm pool, and no CI job had one to lend it.
      # This job does -- the kind cluster installed above is still up and its
      # runner-prewarm daemonset has already rolled out -- so the soak runs
      # HERE rather than paying for a second cluster install in a job of its
      # own. That is what #2056 means by "the cluster tier where a sandbox
      # exists".
      #
      # The rung is report only, on the #1603 precedent
      # (`cli/scripts/e2e-ladder.sh`, the live cluster eval): it prints its
      # result into the run log and the job summary so a reader can act on it,
      # but nothing it observes can turn this nightly red. A soak is a
      # load/chaos probe on a shared 2-CPU GitHub runner; graduating it to a
      # gate needs a stable baseline first, and a flaky gate on the nightly
      # would train the skim reflex on a workflow whose other rungs are real
      # gates.
      #
      # HOW it is report only is load bearing. The whole rung is ONE step that
      # captures every exit status inside the shell and ends in an
      # unconditional `exit 0`, exactly the shape #1603 uses. It is
      # deliberately NOT `continue-on-error: true`. The retry-eligibility gate
      # (`tools/ci-retry-gate/tests/test_retry_eligibility.py`) draws a closed
      # world around `continue-on-error`: it reads that marker as a retry, and
      # a retry is permitted only on a step that acquires a third-party
      # dependency before any repository code runs, never on one that builds,
      # tests or gates this repository's code. A rung driving this repository's
      # own soak harness is exactly what that world exists to exclude, so
      # blanket-swallowing its failure would be the gate's central prohibition
      # rather than an exemption from it. `exit 0` says the same thing without
      # asking CI to swallow anything: the step really did succeed at its job,
      # which is to report.
      #
      # Placement is deliberate: after the graded cluster rung (so the soak
      # never perturbs the pods the graded turn is asserting on) and before the
      # diagnostics dump (so a soak-visible break still gets pods, events and
      # worker logs in the same run).
      #
      # The uv acquisition is the one part of the rung that stays outside that
      # step: `uv sync` needs uv on PATH before the rung's own shell starts.
      # It is a plain, unprotected `uses:` -- no `continue-on-error`, no
      # `id:`, no endpoint probe, no backoff and no `(retry)` copy -- because
      # that is exactly how this job already acquires every other third-party
      # action it depends on: `actions/checkout`, `actions/download-artifact`,
      # `azure/setup-helm`, `docker/setup-buildx-action`, four
      # `docker/build-push-action` steps and the kind-cluster action, none of
      # them retried. A retry here would buy a marginal reduction in a failure
      # mode this job already accepts nine times over, and the price is an
      # entry in an unrelated gate's policy table
      # (`RETRY_ALLOWLIST` in `tools/ci-retry-gate/tests/test_retry_eligibility.py`)
      # for a step that is not the soak rung itself. No `uv lock --check` here
      # (unlike ci.yaml): the lockfile gate belongs to the PR CI that can act
      # on it.
      #
      # The downstream consequence is already handled, and is recorded here so
      # nobody "fixes" it: if uv never installs, the report-only step's
      # `uv sync` fails and then `cli/target/release/curie --json dev soak`
      # fails too. That step captures both statuses, writes them to the run log
      # and the job summary, and still ends in its unconditional `exit 0`. The
      # rung reports "could not run" -- which is the honest answer -- instead
      # of reddening the nightly.
      #
      # Both soak steps carry `if: success() || failure()` so the rung runs
      # whether or not an earlier step in this job succeeded. #2056 exists
      # precisely because this scenario had no automated path anywhere; gating
      # the rung on the graded cluster rung passing would reintroduce a whole
      # class of night on which it still never runs -- and the nights the
      # graded turn breaks are exactly the nights a soak signal is most worth
      # having. The rung is report only and its result is independent of the
      # graded turn's outcome, so running it after a failure costs nothing but
      # runner minutes and cannot change the job's result (the step ends in an
      # unconditional `exit 0`, and an earlier failure still fails the job).
      # `success() || failure()` rather than a bare `always()`: `always()` also
      # runs on job CANCELLATION, which burns a runner on a result nobody will
      # read.
      # The honest consequence, so nobody reads a skip as a break: if the
      # cluster install itself failed, there is no reachable context, namespace
      # or warm pool, and `curie dev soak`'s own preflight reports
      # `status: "skipped"` with a NAMED reason and exits 0. A named skip in
      # the summary is the correct, readable outcome -- neither a false green
      # nor a false red.
      - name: Install uv for the soak rung
        if: success() || failure()
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      # The rung itself: workspace sync, Valkey port-forward, the scenario, and
      # the teardown, all in one step so a single `exit 0` at the bottom is the
      # only thing that decides this rung's effect on the job.
      #
      # `uv sync` resolves THIS repository's own lockfile, so it belongs inside
      # the report-only body rather than beside the uv acquisition: it is
      # repository code, not a bare third-party fetch.
      #
      # The soak harness (`tests/soak/harness.py`, `SoakConfig.from_env`)
      # defaults `TEST_VALKEY_HOST`/`TEST_VALKEY_PORT` to localhost:26379 --
      # the dev-stack compose Valkey a developer has running beside a standing
      # cluster. This job has no dev stack: Valkey lives IN the kind cluster,
      # deployed by the chart as the headless Service `curie-valkey` (release
      # `curie`, `charts/curie/templates/valkey.yaml` renders
      # `{{ include "curie.fullname" . }}-valkey`) on port 6379, with password
      # `valkeypass` (charts/curie/values.yaml). Forwarding it to 26379 meets
      # the harness's env contract without editing the harness.
      #
      # The readiness check is a bounded TCP-connect poll rather than a bare
      # `sleep`: `kubectl port-forward` returns immediately and establishes the
      # listener asynchronously, so a fixed sleep is either a false-ready race
      # or wasted nightly minutes. That poll is why this step is on
      # RUN_RETRY_EXEMPT in the retry gate -- it waits for a service it did not
      # build to start answering and never re-invokes a command whose failure
      # would be a defect, which is the gate's own stated definition of a
      # readiness poll rather than a retry.
      #
      # `curie dev soak` is the one entry point for this scenario (CLAUDE.md's
      # one-entry-point rule); it sets CURIE_SOAK=1 and preflights the kube
      # context, so the workflow drives it purely with env.
      #
      # The verb's own skip path is what keeps this rung honest: with no
      # reachable context, no such namespace, or no reachable SandboxWarmPool
      # it emits `status: "skipped"` with a NAMED reason and exits 0. So a
      # nightly whose install did not produce a claimable pool reports a skip
      # -- not a false green (which a bare `|| true` would give) and not a
      # false red. A non-zero exit means the scenario itself failed, and that
      # is the signal worth reading in the summary below.
      #
      # CURIE_SOAK_CONCURRENCY=2 / CURIE_SOAK_BATCH=1 override the harness
      # defaults (5 / 3) on purpose: the `pool_ready` fixture blocks until the
      # warm pool reports concurrency + batch READY replicas, and a 2-CPU
      # GitHub runner cannot hold the 8 ready sandboxes the defaults demand
      # against the chart's default ResourceQuota -- it would sit out the
      # fixture's 300s deadline every night. 3 is what fits, and it still
      # exercises every phase (concurrent threads, a batch burst, a mid-run
      # kill, a resume under load).
      #
      # CURIE_SOAK_RUNS=1: the three-consecutive-runs shape is the
      # definition-of-done target for an operator-driven soak on real hardware,
      # not something to spend nightly minutes on inside a 30-minute job.
      - name: "Soak and chaos rung (curie dev soak, REPORT ONLY, #1603/#2056)"
        # See the uv step above for why this is `success() || failure()` and
        # not `always()`: the rung must still run on a night the graded rung
        # failed (#2056's "it never runs anywhere"), but not on cancellation.
        if: success() || failure()
        env:
          CURIE_SANDBOX_E2E_NAMESPACE: curie
          # The chart names the default warm pool `<release>-runner-pool`
          # (charts/curie/templates/agent-sandbox.yaml), so this install's pool
          # is `curie-runner-pool` -- NOT the harness's `curie-g1` defaults,
          # which name a developer's standing g1 cluster.
          CURIE_SANDBOX_E2E_POOL: curie-runner-pool
          CURIE_SOAK_CONCURRENCY: "2"
          CURIE_SOAK_BATCH: "1"
          CURIE_SOAK_RUNS: "1"
          TEST_VALKEY_HOST: localhost
          TEST_VALKEY_PORT: "26379"
          TEST_VALKEY_PW: valkeypass
        run: |
          # `set +e` on purpose: GitHub's default shell is `bash -e {0}`, which
          # would abort this step at the first non-zero status before it could
          # be captured, summarized, or explained. This rung reports its
          # status; it does not die on it.
          set +e
          set -uo pipefail

          # The port-forward is torn down on every exit path, including the
          # ones nobody planned for. A trap is not a retry construct: it fires
          # once, on the way out, and re-invokes nothing.
          pf_pid=""
          cleanup() {
            if [[ -n "$pf_pid" ]]; then
              kill "$pf_pid" 2>/dev/null
            fi
          }
          trap cleanup EXIT

          uv sync
          sync_status=$?

          kubectl port-forward -n curie svc/curie-valkey 26379:6379 \
            > /tmp/valkey-port-forward.log 2>&1 &
          pf_pid="$!"
          pf_ready=0
          for attempt in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/26379) 2>/dev/null; then
              echo "valkey port-forward ready on 127.0.0.1:26379 after ${attempt} attempt(s)"
              pf_ready=1
              break
            fi
            sleep 2
          done
          if [[ "$pf_ready" -ne 1 ]]; then
            echo "valkey port-forward did not become ready within 60s" >&2
            cat /tmp/valkey-port-forward.log >&2
          fi

          # stdout and stderr are captured separately, not merged: under
          # --json the verb puts exactly one result object on stdout and
          # routes all pytest chatter to stderr, so redirecting only stdout
          # keeps /tmp/soak-result.json a single parseable object for the
          # summary block below, while the pytest transcript still reaches
          # the job log in real time via stderr.
          cli/target/release/curie --json dev soak > /tmp/soak-result.json
          status=$?
          echo "--- curie dev soak result (/tmp/soak-result.json) ---"
          cat /tmp/soak-result.json
          {
            echo "### Soak and chaos rung (report only, #2056)"
            echo
            echo "\`uv sync\` exit status: \`${sync_status}\`"
            echo
            echo "Valkey port-forward ready: \`${pf_ready}\` (1 = ready)"
            echo
            echo "\`curie dev soak\` exit status: \`${status}\` — this rung cannot fail the nightly (#1603 precedent)."
            echo
            echo '```json'
            cat /tmp/soak-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -ne 0 ]]; then
            echo "soak: the scenario reported a failure. Not failing the job: this rung is report only (#1603/#2056)." >&2
          fi
          # Unconditional, and the only exit in this body. This -- not
          # `continue-on-error` -- is what makes the rung report only; see the
          # block comment above for why the distinction is not cosmetic.
          exit 0
      # worker/runner logs are what localize a reachability or scheduling break.
      # Deliberately no `kubectl get secret`: the credential reaches the pod via
      # secretKeyRef (not plaintext in the pod spec) and runner log redaction
      # (#518) scrubs it, so this dump never surfaces the credential value.
      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -n curie --sort-by=.lastTimestamp | tail -50 || true
          kubectl describe pods -n curie -l app.kubernetes.io/component=runner-sandbox || true
          kubectl logs -n curie -l app.kubernetes.io/component=worker --tail=100 || true
